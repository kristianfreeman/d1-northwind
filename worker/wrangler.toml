main = "index.ts"
name = "northwind-worker"
compatibility_flags = [ "nodejs_compat" ]
compatibility_date = "2024-09-23"

[observability]
enabled = true

[dev]
port=8789

[placement]
mode = "smart"

[[d1_databases]]
binding = "DB"
database_name = "northwind"
database_id = "8a5aa1ac-24c7-4dea-a1aa-5cf0f5d20a68"

[[d1_databases]]
binding = "DB-Read-Replication"
database_name = "northwind-read-replication"
database_id = "f703ac35-c982-4207-8519-703170137aa1"

[[kv_namespaces]]
binding = "PRODUCT_SEARCH_CACHE"
id = "fb5a73689cfa48f7a901706440c193af"

[[vectorize]]
binding = "VECTORIZE"
index_name = "northwind-vector-db"
