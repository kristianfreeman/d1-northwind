main = "index.ts"
name = "northwind-worker"
compatibility_flags = [ "nodejs_compat" ]
compatibility_date = "2024-09-23"

[observability]
enabled = true

[dev]
port=8789

[placement]
mode = "smart"

[[d1_databases]]
binding = "DB"
database_name = "northwind"
database_id = "8a5aa1ac-24c7-4dea-a1aa-5cf0f5d20a68"

[[kv_namespaces]]
binding = "PRODUCT_SEARCH_CACHE"
id = "6e8f104a72c44e509cae22fc0de62616"

[[vectorize]]
binding = "VECTORIZE"
index_name = "northwind-vector-db"
